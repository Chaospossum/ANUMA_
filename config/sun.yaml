# Sun-model configuration is separate from the scored-layer policy.

horizon:
  azimuth_count: 360
  azimuth_origin_deg: 0.0
  # Use every available 240 m DEM sample in each ray direction. A smaller
  # local cutoff would omit far-terrain shadowing and is not accepted.
  far_terrain: full_240m_dem
  moon_radius_m: 1737400.0

sun:
  disk_radius_deg: 0.27
  ephemeris_provider: spiceypy_de440
  frame: MOON_ME
  aberration_correction: LT+S
  observer: MOON
  target: SUN
  # MeluXina project p201619, operator report 12 October 2026.
  # SHA-256 pins stay in this manifest. Do not copy them into the repository.
  kernel_manifest: /project/home/p201619/spice-kernels/kernel-manifest.json
  # Roles the operator reported present and SHA-256 verified twice.
  # The job refuses to run if any of these roles is missing.
  required_kernel_roles:
    - DE440
    - moon_pa_de440_200625
    - moon_de440_250416.tf
    - naif0012

# Operator-reported geometry sanity check. Not the AVGVISIB validation
# gate and not a scored illumination result. No Slurm job id was supplied.
geometry_sanity:
  reported_on: "2026-10-12"
  project: p201619
  environment: .venv-hpc-sun
  environment_built: true
  check: south-pole Sun elevation over calendar 2029
  result: within ±1.53°
  slurm_job_id: null
  kind: operator_reported_geometry_sanity_check

scenario:
  default_start_utc: "2029-01-01T00:00:00Z"
  default_end_utc: "2030-01-01T00:00:00Z"
  cadence_hours: 1.0
  mission_start_utc: null
  mission_end_utc: null
  lit_threshold_fraction: 0.80

validation:
  measured_layer: avgvisib_65s_240m_201608
  # Citation, hourly 18.6-year windows, and the two labeled starts live here.
  # NASA publishes no start or end; do not infer dates from the filename.
  epoch_manifest: config/sun-epoch.yaml
  metrics:
    - rmse
    - bias
    - scatter
  stop_rmse: 0.05
  tune_threshold_after_run: false
  report_directory: out/sun-validation
  # RMSE 0.05 against avgvisib_65s_240m_201608 has not been run.
  status: unrun
  blocking: true

execution:
  nodes: 1
  maximum_workers: 128
  accelerators: false
