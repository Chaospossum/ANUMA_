# All layer constants for ANUMA. Do not hard-code these in Python.

projection:
  proj4: "+proj=stere +lat_0=-90 +lon_0=0 +R=1737400 +units=m +no_defs"
  geodetic_proj4: "+proj=longlat +R=1737400 +no_defs"
  radius_m: 1737400.0
  resolution_m: 240.0
  lat_min: -90.0
  lat_max: -80.0

paths:
  raw: data/raw
  grid: data/grid
  quicklook: data/quicklook
  grid_json: data/grid/grid.json
  artemis_geojson: data/artemis3_regions.geojson
  # Stage E daily lit hours (job 5342908); read from the data root like the grid.
  daily_lit: out/hpc/daily-lit-production-5342908

hard:
  max_slope_deg: 8.0
  goal_slope_deg: 5.0
  # Slope must pass at every pixel centre within this distance; 0 checks the pixel alone.
  slope_radius_m: 0.0

scoring:
  default_normalization_policy: decided_per_layer
  normalization_policies:
    legacy_global_2_98:
      description: "Comparison only: the former global percentile policy."
      default:
        method: percentile
        percentile_low: 2.0
        percentile_high: 98.0
        scope: valid
    decided_per_layer:
      description: "Default policy: preserve illumination's bright tail and bound coarse hydrogen."
      layers:
        slope:
          method: min_max
          scope: hard_mask
        illumination:
          method: min_max
          scope: valid
        hydrogen:
          method: percentile
          percentile_low: 2.0
          percentile_high: 98.0
          scope: valid
        earth_visibility:
          method: percentile
          percentile_low: 2.0
          percentile_high: 98.0
          scope: valid
    all_min_max:
      description: "Comparison only: min–max every layer on valid pixels."
      default:
        method: min_max
        scope: valid
  n_sites: 10
  min_separation_km: 10.0
  weights:
    illumination: 0.5
    hydrogen: 0.3
    earth_visibility: 0.2

stability:
  # Monte Carlo weight study behind the "Top-10 %" column; read from the data root.
  monte_carlo_summary: out/hpc/monte-carlo-full-5332991/study-summary.json
  monte_carlo_job: "5332991"
  policy: decided_per_layer
  note: "weights varied ±0.1, default normalisation; legacy_global_2_98 picks a different winner"
  # Committed 20 m slope check for the default top 10, read from the repo.
  stage_b_checks: data/checks/stage-b-1km.json

# Month window for the Stage E illumination scenario in /score and the layer view.
# End month is inclusive. Outside this range the request is rejected.
illumination_window:
  first_month: "2026-01"
  last_month: "2044-08"
  default_label: "18.6-yr average (published map)"
  note: "Scenario window, not mission dates"

provenance:
  illumination_affine_revision: pds3-pixel-center-v2

hpc_studies:
  clip_weight_monte_carlo:
    seed: 20261012
    draws:
      pilot: 8
      full: 500
    weight_ranges:
      illumination: [0.4, 0.6]
      hydrogen: [0.2, 0.4]
      earth_visibility: [0.1, 0.3]
    normalize_weights_to_one: true
    policies:
      - legacy_global_2_98
      - decided_per_layer
      - all_min_max
    clipped_policy: legacy_global_2_98
    unclipped_policy: decided_per_layer
    winner_class_radius_km: 10.0
  # Stage D site-local LOLA DEM-noise study. Frozen on 2026-10-15 in
  # docs/stage-d-plan.md before any noise run. No code reads this yet.
  # Do not tune these values after seeing noise results.
  dem_noise:
    frozen_on: "2026-10-15"
    plan: docs/stage-d-plan.md
    stability_rule:
      # Answers "which sites are rank-marginal", not "is rank 1 robust".
      source_study: clip_weight_monte_carlo
      source_job: "5332991"
      policy: decided_per_layer
      min_top10_frequency: 0.80
      rank_margin: 2            # default ranks 9-12 (n_sites-1 .. n_sites+2)
      # Code must recompute the rule and assert it reproduces this list.
      frozen_unstable_ids: ["779:1564", "1252:1287", "1277:1142", "1206:1114"]
    controls:
      top_ranks: 3
      # Default rank 8 (1 km fraction 0.50 at zero noise) added 2026-10-15,
      # before any noise draw.
      extra_ranks: [8]
      frozen_ids: ["1318:1219", "1292:1255", "1350:1392", "791:1624"]
    site_order: ["1318:1219", "1292:1255", "1350:1392", "791:1624",
                 "779:1564", "1252:1287", "1277:1142", "1206:1114"]
    noise_model:
      error_filename: LDEM_80S_20MPP_ADJ_ERR.TIF
      effres_filename: LDEM_80S_20MPP_ADJ_EFFRES.TIF
      slope_error_filename: LDSM_80S_20MPP_ADJ_ERR.TIF   # acceptance check only
      error_is_one_sigma: true  # assumption; Barker et al. (2023) do not say
      distribution: gaussian
      correlation: gaussian_kernel
      effres_window_statistic: median
      # EFFRES is read as a FWHM: sigma = EFFRES / 2.355.
      effres_is_fwhm: true
      fwhm_to_sigma_divisor: 2.355
      # Declared sensitivity run: sigma = EFFRES (smoother noise).
      sensitivity_sigma_equals_effres: true
      # Used only if EFFRES cannot be staged; it is a FWHM (sigma = 40/2.355).
      fallback_fwhm_m: 40.0
      rescale_to_error_map: true
    ellipse:
      radius_m: 1000.0
      max_slope_deg_from: hard.max_slope_deg
      threshold_fraction: 0.50
      # Decisive: noise-unstable if the 5-95 % interval of the <=8 deg
      # fraction is wider than 0.10 or straddles threshold_fraction.
      interval_percentiles: [5, 95]
      max_interval_width: 0.10
      percentile_method: linear   # numpy default
      # Straddle is expected for default ranks 1, 8, 9; it means pass/fail is
      # undecidable under the DEM error. Width carries noise sensitivity.
      # Report which clause fired per site.
      report_clause_fired: true
      # About +-15 % sampling uncertainty on a width at N=200.
      borderline_width_band: [0.085, 0.115]
      # Pass/fail and flip rate are reported, not decisive.
      report_pass_fail: true
      patch_connectivity: 8
    in_cell_fine_pixels: 144
    draws: 200
    seed: 20261016
    window_half_size_m: 5000.0
    resolution_m: 20.0
    slope_method: horn_3x3
    acceptance:
      zero_noise_slope_atol_deg: 1.0e-4
      noise_std_ratio_tolerance: 0.05
      slope_noise_vs_ldsm_err_max_factor: 2.0
      # Decisive for the primary run only; reported for the sensitivity run.
      slope_noise_check_decisive_runs: [primary]
      # Stage B 1 km fractions exist for default ranks 1-10 only.
      stage_b_fraction_check_ranks: [1, 10]
    execution:
      nodes: 1
      pilot_qos: test
      pilot_walltime: "00:30:00"
      production_node_hours: 2.0
      stage_node_hour_cap: 50.0

earth_visibility:
  # Approximation: 100 km ray toward sub-Earth (lon 0°, lat 0°) in the
  # stereographic plane. Horizon elevation is the max terrain elevation
  # angle along that ray (sphere + DEM height). Compared with
  # asin(cos(lat)*cos(lon)), the elevation of a distant Earth along +X
  # in the ME frame. No libration, no Earth angular size, no refraction.
  ray_length_m: 100000.0
  ray_step_m: 2000.0
  sub_earth_lon: 0.0
  sub_earth_lat: 0.0

layers:
  dem:
    name: dem
    unit: m
    product_name: LDEM_80S_20MPP_ADJ
    filename: LDEM_80S_20MPP_ADJ.TIF
    url: https://pgda.gsfc.nasa.gov/data/LOLA_20mpp/LDEM_80S_20MPP_ADJ.TIF
    expected_bytes: 2696082051
    resolution_m: 20
    coverage: "80S to 90S, polar stereographic, about ±304 km"
    citation: "Barker et al. (2023), Planet. Sci. J. 4, 183. https://doi.org/10.3847/PSJ/acf3e1"
    data_doi: "https://doi.org/10.60903/gsfcpgda-lola-spole"
    licence: "Citation requested on the PGDA product page; no other licence text."
    catalog: https://pgda.gsfc.nasa.gov/products/90

  slope:
    name: slope
    unit: deg
    mode: lower_better
    method: horn_3x3
    citation: "Derived from LDEM_80S_20MPP_ADJ with a 3x3 Horn gradient on the 240 m grid."

  illumination:
    name: illumination
    unit: fraction
    mode: higher_better
    product_name: AVGVISIB_65S_240M_201608
    filename: avgvisib_65s_240m_201608.jp2
    url: https://pds-geosciences.wustl.edu/lro/lro-l-lola-3-rdr-v1/lrolol_1xxx/extras/illumination/jp2/avgvisib_65s_240m_201608.jp2
    expected_bytes: 48625783
    sha256: 4ccaf5ef7cdfc35bbff4d28e0d9b1051d9d56a66181cda633e71bfd42237dd49
    scale: 0.00004
    offset: 0.0
    nodata: -32768
    resolution_m: 240
    coverage: "complete 65S to pole; partial to about 55.2S"
    citation: "Mazarico et al. (2011), Icarus 211, 1066–1081. https://doi.org/10.1016/j.icarus.2010.10.030"
    licence: "PDS EXTRAS; readme states the files are not supported by PDS or the LOLA team. No licence grant stated."
    catalog: https://pgda.gsfc.nasa.gov/products/69
    # JP2 aux.xml has scale/offset but no CRS. Apply polar stereo from the PDS label.
    # IMG label CENTER_LONGITUDE=0; JP2 label says 180. Use 0 to match LDEM / ANUMA.
    georef:
      width: 6420
      height: 6420
      pixel_m: 240.0
      sample_projection_offset: 3209.5
      line_projection_offset: 3209.5
      center_longitude: 0.0
      proj4: "+proj=stere +lat_0=-90 +lon_0=0 +R=1737400 +units=m +no_defs"
    sidecars:
      - filename: avgvisib_65s_240m_201608_aux.xml
        url: https://pds-geosciences.wustl.edu/lro/lro-l-lola-3-rdr-v1/lrolol_1xxx/extras/illumination/jp2/avgvisib_65s_240m_201608_aux.xml
        expected_bytes: 2142
        sha256: 261418fc773a4ec3056affd2453a8dcfde2715d24cabd7c4856284624a1c01c0
      - filename: avgvisib_65s_240m_201608_jp2.lbl
        url: https://pds-geosciences.wustl.edu/lro/lro-l-lola-3-rdr-v1/lrolol_1xxx/extras/illumination/jp2/avgvisib_65s_240m_201608_jp2.lbl
        expected_bytes: 6464
        sha256: 2d377913872e628f3b27503fd61b3a379046dd85573fba93170e60f5b3257a24

  hydrogen:
    name: hydrogen
    unit: ppm
    mode: higher_better
    product_name: hydrogenhd
    filename: hydrogenhd.dat
    url: https://pds-geosciences.wustl.edu/missions/lunarp/reduced/hydrogenhd.dat
    expected_bytes: 518400
    sha256: 7b9708c95cf3648a6ca6df754648fa18dbcdd2ebd4ae6e8b12dbc18d1e3ad6d4
    ascii_url: https://pds-geosciences.wustl.edu/missions/lunarp/reduced/hydrogenhd.txt
    ascii_filename: hydrogenhd.txt
    width: 720
    height: 360
    dtype: ">i2"
    # PDS special-product note: binary integers are 10× the ASCII ppm values.
    scale: 0.1
    # First line = south pole, first sample = -180°E, 0.5° pixels, south-up.
    xmin: -180.0
    ymax: -90.0
    xres: 0.5
    yres: 0.5
    geodetic_proj4: "+proj=longlat +R=1737400 +no_defs"
    coverage: "global 0.5° cylindrical; polar pixels are coarse"
    citation: "Feldman et al. (2001), J. Geophys. Res. 106(E10), 23231–23251. https://doi.org/10.1029/2000JE001444"
    licence: "PDS Geosciences Node special product, not a peer-reviewed PDS archive. No licence text."
    catalog: https://pds-geosciences.wustl.edu/missions/lunarp/reduced_special.html
    fallback_reason: "LRO LEND has no downloadable collimated-epithermal hydrogen map on PDS; only time-series counts."

  earth_visibility:
    name: earth_visibility
    unit: deg
    mode: higher_better
    citation: "Derived from the ingested DEM. Clearance = Earth elevation minus horizon elevation toward (0°E, 0°N)."

artemis3:
  approximate: true
  coordinate_status: nasa_centres_unpublished
  distinction: >
    The 19 August 2022 NASA list has 13 candidate regions and includes
    Connecting Ridge, the Shackleton connecting ridge. The 28 October 2024
    list has nine regions and does not include that ridge. de Gerlache Rim 2
    is in the 2024 list and lies next to that ridge. NASA does not publish
    region centres on nasa.gov. NASA SVS 5013 shows the 13 regions and does
    not publish numeric coordinates. Approximate points for the 13 names are
    the Mean Earth sites in Goossens et al. (2025) Table 1, not NASA polygons.
    Peak near Cabeus B, Mons Mouton Plateau, Mons Mouton, and Slater Plain
    have no citable centre in a peer-reviewed paper or an SVS coordinate file,
    so their geometries stay empty.
  lists:
    "2022":
      announced: "2022-08-19"
      count: 13
      source_url: https://www.nasa.gov/news-release/nasa-identifies-candidate-regions-for-landing-next-americans-on-moon/
      box_note: "The 2022 release described each region as about 15 km by 15 km. That size is not drawn here."
    "2024":
      announced: "2024-10-28"
      count: 9
      source_url: https://www.nasa.gov/news-release/nasa-provides-update-on-artemis-iii-moon-landing-regions/
      box_note: "The 2024 release does not repeat a region size."
  point_source:
    citation: "Goossens, S. J., Smith, D. E., Zuber, M. T., and Head, J. W. (2025), Shallow crustal density in the lunar south polar region, Planet. Sci. J. 6, 191, Table 1. https://doi.org/10.3847/PSJ/adf05f"
    doi: https://doi.org/10.3847/PSJ/adf05f
    frame: "Mean Earth longitude, positive east, and latitude"
    kind: approximate_point
  svs:
    id: 5013
    url: https://svs.gsfc.nasa.gov/5013/
    coordinates_published: false
  # lon_east and lat are the published Table 1 strings. They are point sites
  # the paper investigated, not NASA region centres. Names without those keys
  # stay null.
  regions:
    - name: Faustini Rim A
      lists: ["2022"]
      paper_name: Faustini Rim A
      lon_east: "90.000"
      lat: "-87.890"
    - name: Peak Near Shackleton
      lists: ["2022"]
      paper_name: Pt Nr Shackleton
      lon_east: "123.691"
      lat: "-88.811"
    - name: Connecting Ridge
      lists: ["2022"]
      paper_name: Connecting Ridge
      lon_east: "222.51"
      lat: "-89.463"
    - name: Connecting Ridge Extension
      lists: ["2022"]
      paper_name: Connecting Ridge Ext
      lon_east: "258.001"
      lat: "-89.032"
    - name: de Gerlache Rim 1
      lists: ["2022"]
      paper_name: de Gerlache Rim 1
      lon_east: "292.068"
      lat: "-88.684"
    - name: de Gerlache Rim 2
      lists: ["2022", "2024"]
      paper_name: de Gerlache Rim 2
      lon_east: "295.372"
      lat: "-88.231"
    - name: de Gerlache-Kocher Massif
      lists: ["2022"]
      paper_name: de Gerlache-Kocher Massif
      lon_east: "243.678"
      lat: "-85.831"
    - name: Haworth
      lists: ["2022", "2024"]
      paper_name: Haworth
      lon_east: "337.223"
      lat: "-86.765"
    - name: Malapert Massif
      lists: ["2022", "2024"]
      paper_name: Malapert
      lon_east: "359.764"
      lat: "-85.996"
    - name: Leibnitz Beta Plateau
      lists: ["2022"]
      paper_name: Leibnitz Beta Plateau
      lon_east: "31.743"
      lat: "-85.428"
    - name: Nobile Rim 1
      lists: ["2022", "2024"]
      paper_name: Nobile Rim 1
      lon_east: "37.367"
      lat: "-85.440"
    - name: Nobile Rim 2
      lists: ["2022", "2024"]
      paper_name: Nobile Rim 2
      lon_east: "58.822"
      lat: "-83.956"
    - name: Amundsen Rim
      lists: ["2022"]
      paper_name: Amundsen Rim
      lon_east: "69.444"
      lat: "-84.230"
    - name: Peak near Cabeus B
      lists: ["2024"]
    - name: Mons Mouton Plateau
      lists: ["2024"]
    - name: Mons Mouton
      lists: ["2024"]
    - name: Slater Plain
      lists: ["2024"]
