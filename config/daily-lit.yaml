# Stage E — 240 m daily lit-hours cube for the web GUI date-range average.
# Reuses the Stage A horizon cube, lit rule, SPICE path, and kernel pin from
# config/sun.yaml. It does not recompute horizons and is not a mission claim.

stage: E-daily-lit-240m

period:
  # Precompute span, not a mission interval. The mission case remains open.
  # Start is ANUMA's choice: the first UTC day of the year the GUI needs.
  start_utc: "2026-01-01T00:00:00Z"
  # Exclusive. 2026-01-01 + 18.6 × 365.25 days is 2044-08-07T15:36Z; the end
  # is rounded up to the next month start so the monthly sums end cleanly.
  end_utc: "2044-09-01T00:00:00Z"
  minimum_span_years: "18.6"
  year_length_days: "365.25"
  cadence_hours: 1
  label: "one lunar nodal cycle of precomputed days; not a mission interval"

pilot:
  # Seven full UTC days on the full grid: 168 epochs.
  start_utc: "2026-01-01T00:00:00Z"
  days: 7
  # Rows re-evaluated with the Stage A accumulator for the equivalence check.
  check_row_stride: 32

output:
  # Out-of-cap pixels (NaN in the Stage A layers) carry these fill values.
  lit_hours_fill_uint8: 255
  cumulative_fill_uint32: 4294967295

execution:
  nodes: 1
  maximum_workers: 128
  accelerators: false
  memory: 240G
  # Days evaluated per dispatch to the row-tile pool (16 × 24 = 384 epochs).
  chunk_days: 16
  pilot_node_hours: 0.5
  production_node_hours: 3.0
  production_walltime: "03:00:00"
  # Proposed draw from the 55 held node-hours; not authorized by this file.
  stage_node_hour_cap: 3.5

stage_a:
  # Job 5334265 passed RMSE 0.0198 at the frozen 0.05 gate.
  job_id: "5334265"
  default_dir: /project/home/p201619/ANUMA_/out/hpc/sun-validation-production-5334265
  stop_rmse: 0.05
  # Reference cost: progress.log of 5334265, epochs 256 -> 163048 between
  # 00:13:31 and 01:19:27 UTC (3956 s / 162792 epochs, 128 workers).
  seconds_per_epoch: 0.0243

acceptance:
  # Fixed before any Stage E run. The full-period mean daily lit fraction is
  # compared with Stage A percent-time-lit (a different 18.6-year window,
  # 2000-2018). Exceeding this flags the run for review; it is not tuned.
  stage_a_mean_rmse_max: 0.02
  tune_after_run: false
